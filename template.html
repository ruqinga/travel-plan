<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>__TRIP_TITLE__</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ff3b30'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='-apple-system,PingFang SC,sans-serif' font-weight='700'>行</text></svg>">
<style>
/* ===== Apple HIG tokens ===== */
:root,.xp{
  --bg:#f2f2f7; --paper:#ffffff; --ink:#000000; --ink2:rgba(60,60,67,.6); --ink3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18); --fill:rgba(118,118,128,.12); --press:#e5e5ea;
  --tint:#007aff; --red:#ff3b30; --orange:#ff9500; --green:#34c759; --indigo:#5856d6;
  --map-water:#d3e5f1; --map-land:#f7f7f5; --map-ink:#8e8e93; --map-park:#dbeed3;
  --main:var(--main-l,#28a148);
  --mat:rgba(242,242,247,.8);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Helvetica Neue","Noto Sans CJK SC",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --paper:#1c1c1e; --ink:#ffffff; --ink2:rgba(235,235,245,.6); --ink3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --press:#2c2c2e;
    --tint:#0a84ff; --red:#ff453a; --orange:#ff9f0a; --green:#30d158; --indigo:#5e5ce6;
    --map-water:#13222c; --map-land:#2c2c2e; --map-ink:#8e8e93; --map-park:#1f3320;
    --main:var(--main-d,#30d158); --mat:rgba(18,18,20,.78);
  }
}
.xp{--main:var(--main-l);color:var(--ink);font:17px/1.47 var(--sans)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
[id]{scroll-margin-top:104px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.47 var(--sans);letter-spacing:-.2px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;letter-spacing:inherit}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}

/* ===== navigation bar ===== */
#nav{display:contents}
.nb{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);transition:background .2s,box-shadow .2s}
.nb.scrolled{background:var(--mat);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nb .row1{max-width:1120px;margin:0 auto;height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px}
.nb .back{display:flex;align-items:center;gap:2px;color:var(--tint);font-size:17px;height:44px;padding:0 8px;justify-self:start}
.nb .back svg{font-size:22px;stroke-width:2.4;margin-left:-4px}
.nb .ttl{font-size:17px;font-weight:600;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.nb.scrolled .ttl{opacity:1;transform:none}
.nb .act{justify-self:end;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:none;color:var(--tint);font-size:22px;cursor:pointer}
.nb .back:active,.nb .act:active,.tbtn:active{opacity:.35}
.chapters{max-width:1120px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 16px 10px}
.chapters::-webkit-scrollbar{display:none}
.chapters a{flex:none;font-size:15px;font-weight:500;padding:6px 14px;border-radius:999px;background:var(--fill);color:var(--ink);transition:background .2s,color .2s}
.chapters a.on{background:var(--ink);color:var(--bg)}
.chapters a:active{opacity:.6}

.wrap{max-width:1120px;margin:0 auto;padding:0 16px calc(64px + env(safe-area-inset-bottom))}
.poster{container-type:inline-size;background:var(--bg);display:flex;flex-direction:column;gap:36px;padding-top:6px}
.xp .poster{padding:64px 56px}

/* ===== large title header ===== */
.lt{display:flex;gap:16px;align-items:flex-start}
.appicon{flex:none;width:64px;height:64px;border-radius:15px;display:grid;place-items:center;color:#fff;font-size:19px;font-weight:700;letter-spacing:1px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--main) 72%,#fff),var(--main));box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 6px 16px -6px color-mix(in srgb,var(--main) 60%,transparent)}
.lt .cap{font-size:13px;font-weight:600;color:var(--main);letter-spacing:.2px}
.lt h1{margin:2px 0 0;font-size:clamp(28px,4.6cqi,40px);line-height:1.2;font-weight:700;letter-spacing:.2px}
.lt .sub{margin:6px 0 0;font-size:clamp(17px,2.2cqi,22px);line-height:1.35;color:var(--ink2);font-weight:500}
.lt .hl{margin:10px 0 0;font-size:15px;color:var(--ink2);line-height:1.6}

/* ===== inset grouped lists ===== */
.sec{display:flex;flex-direction:column;gap:8px;min-width:0}
.sh{padding:0 16px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sh .ov{font-size:13px;color:var(--ink2);letter-spacing:.3px;width:100%}
.sh h2{margin:0;font-size:22px;line-height:1.27;font-weight:700;letter-spacing:.2px}
.sh .aside{font-size:15px;color:var(--ink2)}
.sf{margin:0;padding:2px 16px 0;font-size:13px;color:var(--ink2);line-height:1.55}
.grp{background:var(--paper);border-radius:12px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;transition:background .25s}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:.5px solid var(--sep)}
.row.ico{--inset:58px}
a.row:active,button.row:active{background:var(--press);transition:none}
button.row{width:100%;margin:0;border:0;border-radius:0;background:none;text-align:left;font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
.row .lab{flex:1;min-width:0;display:flex;flex-direction:column}
.row .val{color:var(--ink2);text-align:right;min-width:0}
.row .t{font-size:17px;line-height:1.35}
.row .t b{font-weight:600}
.row .d{font-size:15px;line-height:1.45;color:var(--ink2);margin-top:2px}
.row .chev{color:var(--ink3);font-size:15px;stroke-width:2.6}
.row .go{color:var(--tint);font-size:17px}
.row.link .t{color:var(--tint)}
.ic{flex:none;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:18px;background:var(--c,var(--tint))}
.ic svg{stroke-width:2.1}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--fill);color:var(--ink2);vertical-align:2px;margin-left:6px;white-space:nowrap;letter-spacing:0;line-height:1.4}
.pill.warn{background:color-mix(in srgb,var(--orange) 16%,transparent);color:color-mix(in srgb,var(--orange) 75%,var(--ink))}
.pill.no{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.pill.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:color-mix(in srgb,var(--green) 70%,var(--ink))}

/* timeline rows */
.tl .row{align-items:flex-start;padding:13px 16px}
.tl .row.ico{--inset:108px}
.tl .tm{flex:none;width:44px;font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;padding-top:2px}
.tl .num{flex:none;width:24px;height:24px;border-radius:50%;color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;margin-top:1px;font-variant-numeric:tabular-nums}
.tl .go{margin-top:3px}
.tl .mv{min-height:0;padding:4px 16px 4px 108px;font-size:13px;color:var(--ink2);gap:6px}
.tl .mv::before,.tl .mv+.row::before{display:none}
.tl .mv svg{font-size:13px}
.tl .stay{color:var(--ink2);font-size:15px}
.today-b{font-size:12px;font-weight:600;color:#fff;background:var(--red);border-radius:999px;padding:1px 8px;margin-left:6px}
.alt{margin:0;font-size:15px;line-height:1.55;color:var(--ink2);padding:2px 16px 0}
.alt b{color:var(--ink);font-weight:600}

/* todos */
.td{align-items:flex-start;--inset:52px;cursor:pointer}
.td .ck{font-size:24px;line-height:1;margin-top:-1px;color:var(--ink3);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.td.urgent .ck{color:var(--red)}
.td.done .ck{color:var(--green)}
.td.pop .ck{transform:scale(1.25)}
.td.done .t{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--ink3)}
.td .t,.td .d{transition:color .2s}

/* countdown card */
.now{padding:18px 16px 4px}
.now .lb{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--red);letter-spacing:.3px}
.now .dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.now h3{margin:8px 0 0;font-size:22px;line-height:1.27;font-weight:700}
.now .sb{font-size:15px;color:var(--ink2);margin-top:2px}
.now .cdn{font-size:clamp(44px,9cqi,60px);line-height:1.08;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin:14px 0 2px}
.now .cdn .u{font-size:.45em;font-weight:600;color:var(--ink2);letter-spacing:0;margin:0 6px 0 2px}
.now .ft{font-size:13px;color:var(--ink2);padding-bottom:14px}

/* map */
.mapwrap svg{display:block;width:100%;height:auto}
.mapwrap svg text{pointer-events:none}
.mapwrap svg a{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:12px 16px;font-size:13px;color:var(--ink2);border-top:.5px solid var(--sep)}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px;border-radius:2px}

/* stats (export only) */
.stats{display:grid;grid-template-columns:repeat(2,1fr);background:var(--paper);border-radius:12px;overflow:hidden}
.stat{padding:14px 10px;text-align:center;position:relative}
.stat+.stat::before{content:"";position:absolute;left:0;top:14px;bottom:14px;border-left:.5px solid var(--sep)}
.stat span{display:block;font-size:13px;color:var(--ink2)}
.stat b{font-size:20px;font-weight:600}
.webhide{display:none!important}
.xp .webhide{display:grid!important}

/* flights */
.fl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:16px}
.fl+.fl{border-top:.5px solid var(--sep)}
.fl b{display:block;font-size:28px;font-weight:700;line-height:1.1}
.fl .tt{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.fl .n{font-size:13px;color:var(--ink2)}
.fl .r{text-align:right}
.fl .mid{text-align:center;font-size:13px;color:var(--ink2)}
.fl .mid .ln{width:72px;height:1px;background:var(--ink3);margin:6px auto}
.fl .meta{grid-column:1/-1;font-size:13px;color:var(--ink2)}

/* chain + band */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 16px}
.chain .node{font-size:15px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--fill)}
.chain .node.end{background:var(--main);color:#fff}
.chain .via{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 14px}
.chips span{font-size:13px;font-weight:500;padding:4px 11px;border-radius:999px;background:var(--fill)}
.band{border-radius:12px;padding:22px 20px;background:var(--main);color:#fff;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
.band b{font-size:22px;font-weight:700;letter-spacing:.5px}
.band span{font-size:15px;opacity:.85}
.upd{text-align:center;font-size:13px;color:var(--ink2);margin:36px 0 0}
.upd a{color:var(--tint)}

.cols{display:grid;gap:36px;min-width:0}
@container (min-width:720px){
  .poster{gap:44px}
  .cols{gap:28px}
  .cols.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cols.mapr{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);align-items:start}
  .cols.mapr #map{position:sticky;top:110px}
  .lt{align-items:center;gap:22px}
  .appicon{width:84px;height:84px;border-radius:19px;font-size:24px}
  .stats{grid-template-columns:repeat(var(--n,4),1fr)}
}
.xp .cols.mapr #map{position:static}
.xp .noexp{display:none!important}

/* ===== export poster (phone-screen proportion, always light) ===== */
.pp{--bg:#f2f2f7;--paper:#fff;--ink:#000;--ink2:rgba(60,60,67,.62);--ink3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.16);--fill:rgba(118,118,128,.12);
  --tint:#007aff;--red:#ff3b30;--orange:#ff9500;--green:#34c759;--indigo:#5856d6;--map-water:#d3e5f1;--map-land:#f7f7f5;--map-ink:#8e8e93;--map-park:#dbeed3;
  --main:var(--main-l);--s:1;width:960px;padding:calc(52px*var(--s)) 48px calc(40px*var(--s));background:var(--bg);color:var(--ink);font-family:var(--sans);letter-spacing:-.2px;
  display:flex;flex-direction:column;gap:calc(22px*var(--s))}
.pp .phd{display:flex;gap:26px;align-items:center}
.pp .pai{flex:none;width:calc(104px*var(--s));height:calc(104px*var(--s));border-radius:calc(23px*var(--s));display:grid;place-items:center;color:#fff;font-size:calc(30px*var(--s));font-weight:700;letter-spacing:1px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--main) 72%,#fff),var(--main))}
.pp .pcap{font-size:calc(18px*var(--s));font-weight:600;color:var(--main)}
.pp h1{margin:2px 0 0;font-size:calc(46px*var(--s));line-height:1.15;font-weight:700}
.pp .psub{font-size:calc(24px*var(--s));color:var(--ink2);font-weight:500;margin-top:4px}
.pp .phl{font-size:calc(17px*var(--s));color:var(--ink2);margin-top:6px;line-height:1.5}
.pp .pfacts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--paper);border-radius:18px}
.pp .pfacts div{padding:calc(14px*var(--s)) 10px;text-align:center;position:relative}
.pp .pfacts div+div::before{content:"";position:absolute;left:0;top:25%;bottom:25%;border-left:1px solid var(--sep)}
.pp .pfacts span{display:block;font-size:calc(15px*var(--s));color:var(--ink2)}
.pp .pfacts b{font-size:calc(21px*var(--s));font-weight:600;line-height:1.3}
.pp .pc{background:var(--paper);border-radius:18px;padding:calc(18px*var(--s)) calc(22px*var(--s));min-width:0}
.pp .pc h2{margin:0 0 calc(8px*var(--s));font-size:calc(23px*var(--s));font-weight:700;line-height:1.25}
.pp .pc .ov{display:block;font-size:calc(14px*var(--s));color:var(--ink2);margin-bottom:2px}
.pp .pg{display:grid;gap:calc(18px*var(--s))}
.pp .it{display:grid;grid-template-columns:calc(54px*var(--s)) calc(26px*var(--s)) 1fr;gap:calc(10px*var(--s));align-items:start;padding:calc(7px*var(--s)) 0;border-top:1px solid var(--sep)}
.pp .it:first-of-type{border-top:0}
.pp .it .tm{font-size:calc(17px*var(--s));font-weight:600;font-variant-numeric:tabular-nums;line-height:calc(26px*var(--s))}
.pp .it .num{width:calc(24px*var(--s));height:calc(24px*var(--s));margin-top:1px;border-radius:50%;color:#fff;font-size:calc(13px*var(--s));font-weight:700;display:grid;place-items:center}
.pp .it .t{font-size:calc(18px*var(--s));line-height:calc(26px*var(--s))}
.pp .it .d{font-size:calc(14.5px*var(--s));color:var(--ink2);line-height:1.4;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--clamp,2);overflow:hidden}
.pp .mv{font-size:calc(14px*var(--s));color:var(--ink2);padding:calc(2px*var(--s)) 0 calc(2px*var(--s)) calc(90px*var(--s))}
.pp .mv+.it{border-top:0}
.pp .ps{font-size:calc(15px*var(--s));color:var(--ink2);margin-top:calc(6px*var(--s))}
.pp .pmap{padding:0;overflow:hidden}
.pp .pmap svg{display:block;width:100%;height:auto}
.pp .pmap .legend{font-size:calc(14px*var(--s));padding:calc(10px*var(--s)) 18px}
.pp .kv{display:flex;justify-content:space-between;gap:12px;font-size:calc(17px*var(--s));padding:calc(5px*var(--s)) 0;border-top:1px solid var(--sep)}
.pp .kv:first-of-type{border-top:0}
.pp .kv span:last-child{color:var(--ink2);white-space:nowrap}
.pp .kv.tot{font-weight:700}.pp .kv.tot span:last-child{color:var(--ink)}
.pp .li{font-size:calc(16.5px*var(--s));line-height:1.45;padding:calc(4px*var(--s)) 0 calc(4px*var(--s)) 16px;position:relative}
.pp .li::before{content:"";position:absolute;left:2px;top:calc(.7em);width:6px;height:6px;border-radius:50%;background:var(--main)}
.pp .chips{padding:calc(8px*var(--s)) 0 0;gap:6px}
.pp .chips span{font-size:calc(14px*var(--s));padding:3px 10px}
.pp .band{padding:calc(18px*var(--s)) 22px}
.pp .band b{font-size:calc(24px*var(--s))}
.pp .band span{font-size:calc(15px*var(--s))}
.pp .pft{text-align:center;font-size:calc(13px*var(--s));color:var(--ink2)}
.pp .pill{font-size:calc(12px*var(--s))}

/* ===== sheet (export) ===== */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);opacity:0;transition:opacity .3s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92vh;display:flex;flex-direction:column;background:var(--bg);border-radius:12px 12px 0 0;
  transform:translateY(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);padding-bottom:env(safe-area-inset-bottom);max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--ink3);margin:6px auto 0}
.sheet .hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:48px;padding:0 8px}
.sheet .hd b{font-size:17px;font-weight:600}
.tbtn{border:0;background:none;color:var(--tint);font-size:17px;padding:10px 8px;cursor:pointer}
.tbtn.r{justify-self:end;font-weight:600}
.sheet .body{overflow:auto;padding:4px 16px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.sheet img{width:100%;border-radius:10px;box-shadow:0 0 0 .5px var(--sep)}
.sheet .hint{font-size:13px;color:var(--ink2)}
.sheet .acts{display:flex;flex-direction:column;gap:10px;padding:8px 16px 16px}
.sheet .acts:empty{display:none}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:12px;border:0;font-size:17px;font-weight:600;cursor:pointer;background:var(--tint);color:#fff}
.bigbtn.sec2{background:var(--fill);color:var(--tint)}
.bigbtn:active{opacity:.7}
.busy{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:15px;padding:40px 0}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--fill);border-top-color:var(--ink2);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="nav"></div>
<div class="wrap" id="app"></div>
<script id="trip-data" type="application/json">__TRIP_JSON__</script>
<script>__HTML_TO_IMAGE__</script>
<script>
(function(){
const T = JSON.parse(document.getElementById('trip-data').textContent);
const TZ = T.tz || 'Europe/Madrid';
const THEMES = {forest:['#28a148','#30d158'], sea:['#1a8fb5','#40c8e0'], terracotta:['#e5631f','#ff9f0a'], plum:['#a54fd6','#bf5af2'], olive:['#8d7b55','#ac8e68']};
const th = THEMES[T.theme] || (T.theme && T.theme[0]==='#' ? [T.theme,T.theme] : THEMES.forest);
document.documentElement.style.setProperty('--main-l', th[0]);
document.documentElement.style.setProperty('--main-d', th[1]);
const MARK = {gold:'var(--orange)', accent:'var(--red)', main:'var(--main)', green:'var(--green)', blue:'var(--tint)'};
const WD = ['周日','周一','周二','周三','周四','周五','周六'];
const CN = ['','一','二','三','四','五','六','七','八','九','十'];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gmap = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const md = s => { const [Y,M,D]=s.split('-').map(Number); return {Y,M,D,wd:WD[new Date(Date.UTC(Y,M-1,D)).getUTCDay()]}; };
const fd = s => { const x=md(s); return `${x.M}月${x.D}日 ${x.wd}`; };
const today = (()=>{ const p={}; new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value); return `${p.year}-${p.month}-${p.day}`; })();
const D0 = T.dates && T.dates.start, D1 = T.dates && (T.dates.end || T.dates.start);
const status = !D0 ? 'plan' : (today < D0 ? 'plan' : (today <= D1 ? 'on' : 'gone'));
const days = T.days || [];
/* todo check state: trip.json `done` is the shared default; taps are saved on this device */
const TDKEY = 'travelplan.todos';
const tdAll = (()=>{ try{ return JSON.parse(localStorage.getItem(TDKEY)||'{}'); }catch(e){ return {}; } })();
const tdMine = tdAll[T._slug] || {};
const isDone = t => (t.text in tdMine) ? !!tdMine[t.text] : !!t.done;
const nDays = D0 ? Math.round((Date.parse(D1)-Date.parse(D0))/864e5)+1 : (T.length || days.length || 1);
const dayColor = (d,i) => MARK[d.color] || d.color || (days.length===1 ? 'var(--main)' : (i%2 ? 'var(--main)' : 'var(--red)'));
const dayDate = (d,i) => d.date || (D0 ? new Date(Date.UTC(...D0.split('-').map((v,k)=>k===1?v-1:+v)) + i*864e5).toISOString().slice(0,10) : null);

/* SF-Symbols-like line icons */
const IP = {
  back:'<path d="M15 4l-8 8 8 8"/>', share:'<path d="M12 3v12M8 7l4-4 4 4M7 11H6v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9h-1"/>',
  chev:'<path d="M9 5l7 7-7 7"/>', out:'<path d="M8 16L17 7M9.5 7H17v7.5"/>',
  pin:'<path d="M12 21s-6.5-5.8-6.5-11a6.5 6.5 0 0 1 13 0c0 5.2-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  ppl:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.3c2.6.4 4.5 2.6 4.5 5.7"/>',
  map:'<path d="M9 4L3.5 6.3v13.4L9 17.4l6 2.6 5.5-2.3V4.3L15 6.6 9 4zM9 4v13.4M15 6.6V20"/>',
  route:'<circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8 18h7.5a3.5 3.5 0 0 0 0-7h-7a3.5 3.5 0 0 1 0-7H16"/>',
  bus:'<rect x="5" y="3.5" width="14" height="14" rx="3"/><path d="M5 11h14M8.5 21l1.5-3.5M15.5 21L14 17.5"/>',
  plane:'<path d="M10.5 21l1.5-6.5 6 2.5 1-1.5-6.5-5L13 4.5a1.5 1.5 0 0 0-3 0l.5 6-6.5 5 1 1.5 6-2.5L9.5 21z"/>',
  bed:'<path d="M3 18.5V6.5M3 14h18v4.5M21 14v-2.5a3 3 0 0 0-3-3h-7.5V14"/><circle cx="6.8" cy="10.8" r="1.8"/>',
  list:'<path d="M9.5 6.5H20M9.5 12H20M9.5 17.5H20M4 6.5l1.2 1.2L7.5 5.3M4 12l1.2 1.2 2.3-2.4M4 17.5l1.2 1.2 2.3-2.4"/>',
  ticket:'<path d="M4 7.5h16v3a1.8 1.8 0 0 0 0 3.6v3H4v-3a1.8 1.8 0 0 0 0-3.6z"/><path d="M14 7.5v10" stroke-dasharray="1.5 2"/>',
  circle:'<circle cx="12" cy="12" r="8.5"/>', check:'<circle cx="12" cy="12" r="9" fill="currentColor" stroke="none"/><path d="M8 12.3l2.6 2.6L16 9.5" stroke="#fff" stroke-width="2.2"/>',
  down:'<path d="M12 5v14M7 14l5 5 5-5"/>',
};
const I = (k, cls='') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IP[k]||''}</svg>`;
const icon = (k, c) => `<span class="ic" style="--c:${c}">${I(k)}</span>`;
const tagKind = s => /待|未|需|必须|尽快/.test(s) ? (/需|提前/.test(s)?'warn':'no') : (/已|确认/.test(s) ? 'ok' : '');
const modeIcon = m => /自驾|开车|租车/.test(m||'') ? 'route' : (/飞|航班/.test(m||'') ? 'plane' : 'bus');
const isStay = b => /🏨|酒店|住|hotel/i.test((b.icon||'')+b.title);

/* ---------- nav bar ---------- */
const stLabel = status==='on' ? `在旅 · 第 ${Math.round((Date.parse(today)-Date.parse(D0))/864e5)+1} 天` : status==='gone' ? '已结束' : (D0 ? `还有 ${Math.round((Date.parse(D0)-Date.parse(today))/864e5)} 天出发` : '计划中');
document.getElementById('nav').innerHTML = `<header class="nb noexp" id="nb"><div class="row1">
  <a class="back" href="../">${I('back')}行程</a><div class="ttl">${esc(T.title)}</div>
  <button class="act" id="exp" type="button" aria-label="导出图片" title="导出图片">${I('share')}</button></div>
  <nav class="chapters" id="chapters" aria-label="章节"></nav></header>`;

let h = `<div class="poster" id="poster">`;

/* ---------- large title ---------- */
h += `<header class="lt" id="top"><div class="appicon">${esc(T.seal || (nDays===1?'一日':(CN[nDays]||nDays)+'日'))}</div><div style="min-width:0">
  <div class="cap">${esc(stLabel)}</div><h1 id="h1">${esc(T.title)}</h1>${T.subtitle?`<p class="sub">${esc(T.subtitle)}</p>`:''}
  ${(T.highlights||[]).length?`<p class="hl">${T.highlights.map(esc).join(' · ')}</p>`:''}</div></header>`;


/* info rows */
const info = [];
if(T.from) info.push(['pin','var(--red)','出发地',T.from]);
info.push(['cal','var(--red)','日期', D0 ? (D0===D1 ? fd(D0) : `${fd(D0)} – ${fd(D1)}`) : '待定']);
if(T.people) info.push(['ppl','var(--tint)','人数', T.people+' 人']);
if(T.mode) info.push([modeIcon(T.mode),'var(--green)','交通', T.mode]);
h += `<section class="sec"><div class="grp">${info.map(r=>`<div class="row ico">${icon(r[0],r[1])}<span class="lab t">${esc(r[2])}</span><span class="val">${esc(r[3])}</span></div>`).join('')}</div>
  ${T.overview?`<p class="sf">${esc(T.overview)}</p>`:''}</section>`;

/* countdown (web only) */
const EV = T._events || [];
if(status!=='gone' && EV.length){
  const ft = (T.todos||[]).find(t=>!isDone(t));
  h += `<section class="sec noexp" id="now"><div class="grp"><div class="now"><div class="lb"><span class="dot"></span><span id="now-lb">下一项</span></div>
    <h3 id="now-t"></h3><div class="sb" id="now-s"></div><div class="cdn" id="now-c"></div><div class="ft" id="now-f"></div></div>
    ${(T.todos||[]).length?`<a class="row ico" href="#todos" id="peek" ${ft?'':'hidden'}>${icon('list','var(--orange)')}<span class="lab"><span class="t" id="peek-t">${esc(ft?ft.text:'')}</span><span class="d">当前待办</span></span>${I('chev','chev')}</a>`:''}</div></section>`;
}

/* ---------- days + map ---------- */
const hasMap = T.map && T.map.points;
const dayHtml = days.map((d,i)=>dayCard(d,i)).join('');
if(days.length===1 && hasMap) h += `<div class="cols mapr">${dayHtml}${mapCard()}</div>`;
else { if(days.length) h += `<div class="cols ${days.length>1?'c2':''}">${dayHtml}</div>`; if(hasMap) h += mapCard(); }

/* hikes */
if((T.hikes||[]).length){
  h += `<div class="cols ${T.hikes.length>1?'c2':''}" id="hikes">${T.hikes.map((k,ki)=>{
    const st = [['全程',k.distance],['用时',k.time],['爬升',k.gain],['难度',k.difficulty]].filter(x=>x[1]);
    const url = k.wikiloc || ('https://www.google.com/search?q=' + encodeURIComponent('wikiloc ' + (k.search||k.name)));
    return `<section class="sec"><div class="sh"><span class="ov">徒步路线${T.hikes.length>1?' '+(ki+1):''}</span><h2>${esc(k.name)}</h2>${k.shape?`<span class="aside">${esc(k.shape)}</span>`:''}</div>
      <div class="grp">${st.map(s=>`<div class="row"><span class="lab t">${s[0]}</span><span class="val">${esc(s[1])}</span></div>`).join('')}
      <a class="row link noexp" href="${esc(url)}" target="_blank" rel="noopener"><span class="lab t">在 Wikiloc 查看轨迹</span>${I('out','go')}</a></div>
      ${k.note?`<p class="sf">${esc(k.note)}</p>`:''}</section>`;
  }).join('')}</div>`;
}

/* transport chain */
const TR = T.transport || {};
if((TR.chain||[]).length){
  h += `<section class="sec" id="transport"><div class="sh"><h2>${esc(TR.title||'交通路线')}</h2></div><div class="grp"><div class="chain">${TR.chain.map((c,i)=>
    c.via ? `<span class="via">${esc(c.via)} ${I('chev')}</span>` : `<span class="node ${i===TR.chain.length-1?'end':''}">${esc(c.at)}</span>`).join('')}</div></div>
    ${TR.note?`<p class="sf">${esc(TR.note)}</p>`:''}</section>`;
}

/* long-distance transport */
if((T.flights||[]).length){
  h += `<section class="sec" id="flights"><div class="sh"><h2>长途交通</h2></div><div class="grp">${T.flights.map(f=>`<div class="fl">
    <div><b>${esc(f.from.code)}</b><div class="tt">${esc((f.depart||'').slice(11,16))}</div><div class="n">${esc(f.from.name||'')} · ${fd(f.depart.slice(0,10))}</div></div>
    <div class="mid">${esc(f.duration||'')}<div class="ln"></div>${({train:'高铁',bus:'大巴',ferry:'轮渡'})[f.mode]||esc(f.stops||'航班')}</div>
    <div class="r"><b>${esc(f.to.code)}</b><div class="tt">${esc((f.arrive||'').slice(11,16))}</div><div class="n">${esc(f.to.name||'')}</div></div>
    <div class="meta">${esc([f.airline,f.number].filter(Boolean).join(' '))}${f.status?`<span class="pill ${tagKind(f.status)}">${esc(f.status)}</span>`:''}${f.note?` · ${esc(f.note)}`:''}</div></div>`).join('')}</div></section>`;
}
if((T.bookings||[]).length){
  h += `<section class="sec" id="bookings"><div class="sh"><h2>预订</h2></div><div class="grp">${T.bookings.map(b=>{
    const inner = `${icon(isStay(b)?'bed':'ticket', isStay(b)?'var(--indigo)':'var(--orange)')}
      <span class="lab"><span class="t">${esc(b.title)}${b.status?`<span class="pill ${tagKind(b.status)}">${esc(b.status)}</span>`:''}</span>
      <span class="d">${esc([b.time,b.address,b.note].filter(Boolean).join(' · '))}</span></span>`;
    return (b.q||b.address) ? `<a class="row ico" href="${gmap(b.q||b.address)}" target="_blank" rel="noopener">${inner}${I('chev','chev')}</a>` : `<div class="row ico">${inner}</div>`;
  }).join('')}</div></section>`;
}

/* stay / transport lines / budget / checklist */
const trio = [];
if(T.stay) trio.push(`<section class="sec" id="stay"><div class="sh"><h2>住宿</h2></div><div class="grp">
  ${T.stay.q?`<a class="row ico" href="${gmap(T.stay.q)}" target="_blank" rel="noopener">`:'<div class="row ico">'}${icon('bed','var(--indigo)')}<span class="lab"><span class="t"><b>${esc(T.stay.name)}</b></span>${T.stay.text?`<span class="d">${esc(T.stay.text)}</span>`:''}</span>${T.stay.q?I('chev','chev')+'</a>':'</div>'}</div></section>`);
if((TR.lines||[]).length) trio.push(`<section class="sec" id="tinfo"><div class="sh"><h2>${esc((TR.chain||[]).length?'交通细节':(TR.title||'交通'))}</h2></div><div class="grp">${TR.lines.map(l=>`<div class="row"><span class="lab"><span class="t">${l.label?`<b>${esc(l.label)}</b>　`:''}${esc(l.text)}</span></span>${l.hot?'<span class="pill no">注意</span>':''}</div>`).join('')}
  ${(T.packing||[]).length?`<div class="row" style="padding:0"><div class="chips">${T.packing.map(p=>`<span>${esc(p)}</span>`).join('')}</div></div>`:''}</div></section>`);
if(T.budget) trio.push(`<section class="sec" id="budget"><div class="sh"><h2>${esc(T.budget.title||'预算（一人）')}</h2></div><div class="grp">${(T.budget.rows||[]).map(r=>`<div class="row"><span class="lab t">${esc(r.label)}</span><span class="val">${esc(r.actual||r.est)}</span></div>`).join('')}
  ${T.budget.total?`<div class="row"><span class="lab t"><b>合计</b></span><span class="val" style="color:var(--ink);font-weight:600">${esc(T.budget.total)}</span></div>`:''}</div>${T.budget.note?`<p class="sf">${esc(T.budget.note)}</p>`:''}</section>`);
const tipList = T.checklist || [];
const packOnly = !(TR.lines||[]).length && (T.packing||[]).length;
if(tipList.length || packOnly) trio.push(`<section class="sec" id="checklist"><div class="sh"><h2>${esc(T.checklistTitle||'行前提示')}</h2></div><div class="grp">${tipList.map(t=>`<div class="row"><span class="lab t" style="font-size:16px">${esc(t)}</span></div>`).join('')}
  ${packOnly?`<div class="row" style="padding:0"><div class="chips">${T.packing.map(p=>`<span>${esc(p)}</span>`).join('')}</div></div>`:''}</div></section>`);
if(trio.length) h += `<div class="cols ${trio.length>=3?'c3':trio.length===2?'c2':''}">${trio.join('')}</div>`;

/* todos + tips */
if((T.todos||[]).length){
  h += `<section class="sec" id="todos"><div class="sh"><h2>待办</h2><span class="aside" id="td-count"></span></div><div class="grp" id="td-list"></div>
    <p class="sf">轻点即可勾选。勾选只保存在这台设备上；想让同行的人也看到，告诉 Claude「XX 办完了」来更新页面。</p></section>`;
}
if((T.tips||[]).length){
  h += `<section class="sec" id="tips"><div class="sh"><h2>贴士</h2></div><div class="grp">${T.tips.map(t=>`<div class="row" style="align-items:flex-start"><span class="lab"><span class="t"><b>${esc(t.title)}</b></span><span class="d">${esc(t.text)}</span></span></div>`).join('')}</div></section>`;
}
if(T.band) h += `<div class="band"><b>${esc(T.band.text||'')}</b>${T.band.note?`<span>${esc(T.band.note)}</span>`:''}</div>`;
h += `</div>`;
h += `<p class="upd">${T.updated?`最后更新 ${esc(T.updated)} · `:''}<a href="../">全部行程</a></p>`;
document.getElementById('app').innerHTML = h;

/* ---------- todos: tap to check ---------- */
function renderTodos(pop){
  const $l = document.getElementById('td-list'); if(!$l) return;
  $l.innerHTML = T.todos.map((t,i)=>{ const d = isDone(t);
    return `<button class="row td ${d?'done':''} ${t.urgent&&!d?'urgent':''} ${pop===i?'pop':''}" type="button" role="checkbox" aria-checked="${d}" data-td="${i}">
      <span class="ck">${I(d?'check':'circle')}</span>
      <span class="lab"><span class="t">${esc(t.text)}</span>${(t.due&&!d)||t.note?`<span class="d">${esc([!d&&t.due,t.note].filter(Boolean).join(' · '))}</span>`:''}</span></button>`; }).join('');
  document.getElementById('td-count').textContent = `${T.todos.filter(isDone).length}/${T.todos.length}`;
  const ft = T.todos.find(t=>!isDone(t)), $p = document.getElementById('peek');
  if($p){ $p.hidden = !ft; if(ft) document.getElementById('peek-t').textContent = ft.text; }
  if(pop!=null) setTimeout(()=>{ const b=$l.querySelector(`[data-td="${pop}"]`); if(b) b.classList.remove('pop'); }, 220);
}
if((T.todos||[]).length){
  renderTodos();
  document.getElementById('td-list').addEventListener('click', e=>{
    const b = e.target.closest('[data-td]'); if(!b) return;
    const i = +b.dataset.td, t = T.todos[i];
    tdMine[t.text] = !isDone(t);
    if(tdMine[t.text] === !!t.done) delete tdMine[t.text];     // back to the shared default
    tdAll[T._slug] = tdMine;
    try{ localStorage.setItem(TDKEY, JSON.stringify(tdAll)); }catch(err){}
    if(navigator.vibrate) navigator.vibrate(8);
    renderTodos(i);
  });
}

/* ---------- pieces ---------- */
function autoStats(){
  const s = [{k:'天数', v: nDays===1?'一日':`${nDays} 天 ${nDays-1} 晚`}];
  if(T.dest) s.push({k:'目的地', v:T.dest});
  if(T.mode) s.push({k:'主要交通', v:T.mode});
  if(T.budget && T.budget.total) s.push({k:'预算（一人）', v:T.budget.total});
  return s;
}
function dayCard(d,i){
  const c = dayColor(d,i), dt = dayDate(d,i);
  let n = 0;
  const label = d.badge || (days.length===1 ? '一日行程' : `第${CN[i+1]||(' '+(i+1)+' ')}天`);
  let s = `<section class="sec" id="day${i+1}"><div class="sh"><span class="ov">${esc(label)}${dt?' · '+fd(dt):''}${dt===today?'<span class="today-b noexp">今天</span>':''}</span><h2>${esc(d.title||'')}</h2></div><div class="grp tl">`;
  (d.items||[]).forEach(it=>{
    if(it.move){ s += `<div class="row mv">${I('down')}<span>${esc(it.move)}</span></div>`; return; }
    n++; it._n = n;
    const inner = `<span class="tm">${esc(it.time||'')}</span><span class="num" style="background:${MARK[it.mark]||c}">${n}</span>
      <span class="lab"><span class="t">${esc(it.title)}${it.tag?`<span class="pill ${tagKind(it.tag)}">${esc(it.tag)}</span>`:''}</span>${it.note?`<span class="d">${esc(it.note)}</span>`:''}</span>`;
    s += it.place ? `<a class="row ico" href="${gmap(it.place)}" target="_blank" rel="noopener" title="在地图中打开 ${esc(it.placeLabel||it.place)}">${inner}${I('pin','go noexp')}</a>` : `<div class="row ico">${inner}</div>`;
  });
  if(d.stay) s += `<div class="row ico stay"><span class="tm"></span><span style="width:24px;display:grid;place-items:center;font-size:20px;color:var(--indigo)">${I('bed')}</span><span class="lab">今晚住 ${esc(d.stay)}</span></div>`;
  s += `</div>`;
  if(d.alt) s += `<p class="alt"><b>${esc(d.alt.title||'替代方案')}</b>　${esc(d.alt.text)}</p>`;
  return s + `</section>`;
}
function mapCard(){
  const all = routeUrl(allRoutePts(), T.travelmode || inferMode());
  const per = days.length>1 ? days.map((d,i)=>[d,i,routeUrl(dayPts(d),dayMode(d))]).filter(x=>x[2]) : [];
  return `<section class="sec" id="map"><div class="sh"><h2>路线地图</h2>${T.map.subtitle?`<span class="aside">${esc(T.map.subtitle)}</span>`:''}</div>
    <div class="grp"><div class="mapwrap">${renderMap(all)}</div>
    ${all?`<a class="row ico link noexp" href="${esc(all)}" target="_blank" rel="noopener">${icon('map','var(--green)')}<span class="lab t">在 Google 地图中打开${days.length>1?'全程':''}路线</span>${I('out','go')}</a>
    ${per.map(([d,i,u])=>`<a class="row ico noexp" href="${esc(u)}" target="_blank" rel="noopener">${icon('route',dayColor(d,i))}<span class="lab t">${esc(d.mapLabel||('第 '+(i+1)+' 天'))}</span>${I('out','go')}</a>`).join('')}`:''}</div>
    ${all?'<p class="sf noexp">轻点地图打开整条路线，轻点图钉打开该地点。</p>':''}</section>`;
}
function ploc(p){ return p.q || `${p.lat},${p.lon}`; }
function inferMode(){ const m=(T.mode||'')+' '+((T.hikes||[]).length?'徒步':''); return /自驾|开车|租车|drive/i.test(m)?'driving':(/徒步|步行|hike|walk/i.test(m)&&!/TRAM|大巴|火车|高铁|地铁|飞/i.test(T.mode||'')?'walking':(/TRAM|大巴|火车|高铁|地铁|公交|bus|train/i.test(m)?'transit':'walking')); }
function dayMode(d){ return d.travelmode || T.travelmode || inferMode(); }
function dayPts(d){ const P=T.map.points; const r=(d.route||[]).map(id=>P[id]).filter(p=>p&&!p.offmap); return r.filter((p,i)=>i===0||p!==r[i-1]); }
function allRoutePts(){ const seen=new Set(), out=[]; days.forEach(d=>dayPts(d).forEach(p=>{ if(!seen.has(p)){ seen.add(p); out.push(p); } })); if(!out.length) Object.values(T.map.points).filter(p=>!p.offmap).forEach(p=>out.push(p)); return out; }
function routeUrl(pts, mode){
  if(pts.length<2) return pts.length ? gmap(ploc(pts[0])) : '';

  let u = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(ploc(o))}&destination=${encodeURIComponent(ploc(de))}`;

function renderMap(routeLink, o={}){
  const M = T.map, P = M.points, ids = Object.keys(P);
  let la0=Infinity,la1=-Infinity,lo0=Infinity,lo1=-Infinity;
  ids.filter(k=>!P[k].offmap).forEach(k=>{const p=P[k];la0=Math.min(la0,p.lat);la1=Math.max(la1,p.lat);lo0=Math.min(lo0,p.lon);lo1=Math.max(lo1,p.lon);});
  if(M.bounds) [la0,lo0,la1,lo1] = M.bounds;
  const k = Math.cos((la0+la1)/2*Math.PI/180), w=(lo1-lo0)*k, hg=la1-la0;
  const W=640, pad=46, sc=Math.min((W-2*pad)/(w||1e-3), (o.maxH||M.maxH||560)/(hg||1e-3));
  const H=Math.max(300, Math.round(hg*sc+2*pad)), ox=(W-w*sc)/2, oy=(H-hg*sc)/2;
  const X=lon=>ox+(lon-lo0)*k*sc, Y=lat=>oy+(la1-lat)*sc;
  const path = (pts,close) => pts.map((p,i)=>(i?'L':'M')+X(p[1]).toFixed(1)+' '+Y(p[0]).toFixed(1)).join('') + (close?'Z':'');
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="路线地图" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect width="${W}" height="${H}" fill="${M.land?'var(--map-water)':'var(--map-land)'}"/>`;
  (M.land||[]).forEach(p=>{ s += `<path d="${path(p,1)}" fill="var(--map-land)" stroke="var(--map-ink)" stroke-opacity=".45" stroke-width="1" stroke-linejoin="round"/>`; });
  (M.areas||[]).forEach(a=>{
    s += `<path d="${path(a.poly,1)}" fill="var(--map-park)" stroke="var(--green)" stroke-opacity=".5" stroke-width="1"/>`;
    if(a.name){ const c=a.labelAt||a.poly.reduce((m,p)=>[m[0]+p[0]/a.poly.length,m[1]+p[1]/a.poly.length],[0,0]);
      s += `<text x="${X(c[1])}" y="${Y(c[0])}" fill="var(--green)" font-size="14" font-weight="600" text-anchor="middle" transform="rotate(${a.rotate||0} ${X(c[1])} ${Y(c[0])})" opacity=".9">${esc(a.name)}</text>`; }
  });
  (M.labels||[]).forEach(l=>{ s += `<text x="${X(l.lon)}" y="${Y(l.lat)}" fill="${l.sea?'var(--tint)':'var(--map-ink)'}" font-size="${l.size||13}" font-weight="500" text-anchor="middle" opacity=".7" letter-spacing="2">${esc(l.text)}</text>`; });
  const legend = [];
  (M.lines||[]).forEach(L=>{
    s += `<path d="${path(L.pts)}" fill="none" stroke="${MARK[L.color]||L.color||'var(--map-ink)'}" stroke-width="${L.width||3}" stroke-linecap="round" stroke-linejoin="round" ${L.dash?`stroke-dasharray="${L.dash}"`:''} opacity=".8"/>`;
    if(L.name) legend.push([MARK[L.color]||L.color||'var(--map-ink)', L.name, L.dash]);
  });
  days.forEach((d,i)=>{
    const c = dayColor(d,i), r = (d.route||[]).map(id=>P[id]&&Object.assign({id},P[id])).filter(Boolean);
    if(r.length<2) return;
    if(!d.noLegend) legend.push([c, d.mapLabel || (days.length>1?`第 ${i+1} 天`:'路线'), '']);
    for(let j=0;j<r.length-1;j++){
      let a=r[j], b=r[j+1], ax=X(a.lon), ay=Y(a.lat), bx=X(b.lon), by=Y(b.lat);
      const off = a.offmap||b.offmap;
      if(off){
        const inn=a.offmap?[bx,by]:[ax,ay], out=a.offmap?[ax,ay]:[bx,by];
        const dx=out[0]-inn[0], dy=out[1]-inn[1], L=Math.hypot(dx,dy)||1, len=Math.min(90,L);
        const ex=inn[0]+dx/L*len, ey=inn[1]+dy/L*len;
        if(a.offmap){ax=ex;ay=ey}else{bx=ex;by=ey}
        s += `<text x="${ex}" y="${ey+(dy>0?16:-8)}" font-size="12" fill="var(--map-ink)" text-anchor="middle" paint-order="stroke" stroke="var(--map-land)" stroke-width="3">${esc(a.offmap?a.name:b.name)} 方向</text>`;
      }

  const pinned = {};
  days.forEach((d,i)=>(d.items||[]).forEach(it=>{ if(it.pt && P[it.pt] && !P[it.pt].offmap){ (pinned[it.pt]=pinned[it.pt]||[]).push({n:it._n, c:MARK[it.mark]||dayColor(d,i), time:it.time}); } }));
  ids.forEach(id=>{
    const p=P[id]; if(p.offmap) return; const x=X(p.lon), y=Y(p.lat), pins=pinned[id];
    const lk = `<a href="${esc(gmap(ploc(p)))}" target="_blank" rel="noopener">`;

    } else {

      const t = (pins && p.time!==false && pins[0].time) ? `<tspan font-size="11.5" fill="var(--map-ink)" font-weight="600">${esc(pins[0].time)} </tspan>` : '';

    }

  const kmpx = 111.32/sc, nice=[.5,1,2,5,10,20,50,100], km = nice.find(n=>n/kmpx>55)||100, px=km/kmpx;
  s += `<g transform="translate(18,${H-16})"><rect x="-8" y="-22" width="${px+16}" height="28" rx="8" fill="var(--paper)" opacity=".88"/><path d="M0 -3V0H${px}V-3" fill="none" stroke="var(--map-ink)" stroke-width="1.4"/><text x="${px/2}" y="-8" font-size="10.5" text-anchor="middle" fill="var(--map-ink)">${km} km</text></g>`;
  s += `<g transform="translate(${W-30},30)"><circle r="16" fill="var(--paper)" opacity=".92"/><path d="M0-10L4 1H-4Z" fill="var(--red)"/><path d="M0 10L4-1H-4Z" fill="var(--map-ink)" opacity=".5"/></g>`;
  s += `</svg>`;
  return s + (legend.length?`<div class="legend">${legend.map(([c,t,dash])=>`<span><i style="border-color:${c};${dash?'border-top-style:dashed':''}"></i>${esc(t)}</span>`).join('')}</div>`:'');
}

function buildPoster(host){
  const node = document.createElement('div'); node.className = 'pp'; host.appendChild(node);

function openSheet(html){

  const el = document.createElement('div'); el.className='sheet'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-label','导出图片');
  el.innerHTML = `<div class="grab"></div><div class="hd"><span></span><b>导出图片</b><button class="tbtn r" type="button" data-a="close">完成</button></div><div class="body">${html}</div><div class="acts"></div>`;
  document.body.append(scrim, el); document.body.style.overflow='hidden';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ scrim.classList.add('on'); el.classList.add('on'); }));
  let cleanup = null, closed = false;
  const onKey = e=>{ if(e.key==='Escape') close(); };
  const close = ()=>{ if(closed) return; closed = true; scrim.classList.remove('on'); el.classList.remove('on'); document.body.style.overflow=''; document.removeEventListener('keydown', onKey);
    setTimeout(()=>{ scrim.remove(); el.remove(); cleanup&&cleanup(); }, 400); };
  scrim.addEventListener('click', close);
  el.addEventListener('click', e=>{ if(e.target.closest('[data-a="close"]')) close(); });
  document.addEventListener('keydown', onKey);
  // swipe down to dismiss
  let y0=null; const $b = el.querySelector('.body');
  el.addEventListener('touchstart',e=>{ if($b.scrollTop<=0) y0=e.touches[0].clientY; },{passive:true});
  el.addEventListener('touchmove',e=>{ if(y0==null) return; const dy=Math.max(0,e.touches[0].clientY-y0); el.style.transition='none'; el.style.transform=`translateY(${dy}px)`; },{passive:true});
  el.addEventListener('touchend',e=>{ if(y0==null) return; const dy=e.changedTouches[0].clientY-y0; el.style.transition=''; el.style.transform=''; y0=null; if(dy>120) close(); });
  return { body(b, acts='', bind, onClose){ $b.innerHTML=b; el.querySelector('.acts').innerHTML=acts; if(bind) bind(el); if(onClose) cleanup=onClose; } };
}
})();
</script>
</body>
</html>
