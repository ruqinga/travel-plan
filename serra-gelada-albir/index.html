<title>Benidorm → 翻越 Serra Gelada → L&#x27;Albir</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<style>
:root,.xp{
  --bg:#f3f0e8; --paper:#fbfaf6; --ink:#1e1d1a; --muted:#7d776b; --line:#e3ddcf; --hair:rgba(30,29,26,.09); --dash:#cfc6b2;
  --sand:#ece3cf; --sand-ink:#6f5528; --gold:#a8833f; --accent:#b0392b; --green:#4f7356; --blue:#2f5670;
  --map-water:#cfdcdc; --map-land:#f2ede1; --map-ink:#8a8070; --map-park:#d7e0c9;
  --main:var(--main-l,#4f7356);
  --shadow:0 1px 1px rgba(30,25,15,.03),0 8px 24px -12px rgba(30,25,15,.14);
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121211; --paper:#1c1c1a; --ink:#ecebe6; --muted:#9a958a; --line:#2e2d29; --hair:rgba(255,255,255,.08); --dash:#45423b;
    --sand:#2c2820; --sand-ink:#d9bf8a; --gold:#cfa75e; --accent:#e0644f; --green:#8fb394; --blue:#86abc4;
    --map-water:#1a2426; --map-land:#23221e; --map-ink:#8f887a; --map-park:#283124;
    --main:var(--main-d,#8fb394); --shadow:none;
  }
}
.xp{--main:var(--main-l);color:var(--ink);font:15px/1.6 var(--sans)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
[id]{scroll-margin-top:112px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}

/* navigation bar (web only) */
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;margin:0 -16px 14px;padding:10px 16px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:.5px solid var(--hair)}
.topbar a.back{color:var(--accent);text-decoration:none;font-size:16px;font-weight:500;display:flex;align-items:center;gap:2px}
.topbar a.back::before{content:"";width:10px;height:10px;border-left:2.2px solid currentColor;border-bottom:2.2px solid currentColor;transform:rotate(45deg);margin-right:4px}
.st{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--sand);color:var(--sand-ink)}
.st.on{background:var(--accent);color:#fff}
.st.gone{background:var(--line);color:var(--muted)}
.btn{font:inherit;font-size:14px;font-weight:600;cursor:pointer;border:0;border-radius:999px;padding:7px 15px;background:var(--ink);color:var(--bg);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.topbar .btn{margin-left:auto}
.topbar{flex-wrap:wrap}
.chapters{flex-basis:100%;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px -16px 0;padding:2px 16px 0}
.chapters::-webkit-scrollbar{display:none}
.chapters a{flex:none;font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--paper);color:var(--ink);text-decoration:none;box-shadow:inset 0 0 0 1px var(--line)}
.chapters a.on{background:var(--ink);color:var(--bg);box-shadow:none}
/* countdown (now) card */
.now .lb{font-size:11.5px;letter-spacing:2.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.now .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.now h2{margin:8px 0 2px;font:700 21px/1.35 var(--serif);letter-spacing:1px}
.now .sb{font-size:13px;color:var(--muted)}
.now .cdn{font:700 clamp(30px,7cqi,46px)/1.15 var(--mono);color:var(--accent);margin:10px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:1px}
.now .cdn small{display:block;font:500 12.5px var(--mono);color:var(--muted);letter-spacing:0;margin-top:4px}
.now .peek{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:11px;border-top:.5px dashed var(--dash);font-size:13.5px}
.now .peek b{flex:none;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent);color:#fff}
.now .peek a{margin-left:auto;color:var(--accent);text-decoration:none;font-weight:600;white-space:nowrap}
/* clickable map */
.mapbox svg text{pointer-events:none}
.mapbox svg a{cursor:pointer}
.mapbox svg a.pinlk:hover path,.mapbox svg a.pinlk:hover circle{filter:brightness(1.12)}
.maplinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.maplinks a{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;text-decoration:none;color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,var(--paper))}
.maplinks a.main{background:var(--blue);color:#fff}

/* poster */
.poster{container-type:inline-size;background:var(--bg);display:flex;flex-direction:column;gap:14px}
.xp .poster{padding:48px}
.box{background:var(--paper);border-radius:20px;padding:18px;box-shadow:var(--shadow),inset 0 0 0 .5px var(--hair)}
.box.dashed{background:transparent;box-shadow:none;border:1px solid var(--dash)}
.box h3{margin:0 0 12px;font:700 20px/1.3 var(--serif);color:var(--ink);letter-spacing:1px;display:flex;align-items:center;gap:8px}
.box h3::before{content:"";width:4px;height:1em;border-radius:2px;background:var(--main)}

.hero{position:relative;display:flex;flex-direction:column;gap:14px;padding:26px 20px 22px!important;
  box-shadow:var(--shadow),inset 0 0 0 1px var(--line),inset 0 0 0 6px var(--paper),inset 0 0 0 7px var(--line)!important}
.seal{position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;
  font:700 15px/1.05 var(--serif);text-align:center;letter-spacing:1px;transform:rotate(-4deg);opacity:.92}
.hero h1{margin:0;padding-right:52px;font:800 clamp(27px,5cqi,58px)/1.18 var(--serif);color:var(--ink);letter-spacing:1px}
.hero .sub{margin:6px 0 0;font:700 clamp(17px,2.6cqi,30px)/1.3 var(--serif);color:var(--accent);letter-spacing:2px}
.hero .hl{margin-top:10px;color:var(--muted);font-size:clamp(13px,1.4cqi,16px)}
.hero-r{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:4px 13px;border-radius:999px;background:var(--sand);color:var(--sand-ink);white-space:nowrap}
.pill.main{background:var(--main);color:#fff}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--hair);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.stat{background:var(--paper);padding:11px 8px;text-align:center}
.stat:last-child:nth-child(odd){grid-column:1/-1}
.stat span{display:block;font-size:11.5px;color:var(--muted);letter-spacing:1px}
.stat b{font:700 18px/1.35 var(--serif);color:var(--main)}

.cols{display:grid;gap:14px}
.dayhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.badge{font:700 16px/1 var(--serif);color:#fff;padding:7px 12px;border-radius:9px;white-space:nowrap;letter-spacing:1px}
.dayhead h4{margin:0;font:700 20px/1.3 var(--serif);color:var(--ink);letter-spacing:1px}
.dayhead .dt{font-size:12.5px;color:var(--muted);width:100%}
.today{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:8px 0;position:relative}
.tl li:not(.move)+li:not(.move)::before{content:"";position:absolute;left:14px;top:-10px;height:16px;border-left:1px solid var(--line)}
.num{width:28px;height:28px;border-radius:50%;color:#fff;font:600 13.5px/1 var(--sans);display:flex;align-items:center;justify-content:center;margin-top:1px}
.it .t1{font-weight:600;font-size:15.5px;line-height:1.45}
.it .t1 i{font:600 14.5px var(--mono);font-style:normal;color:var(--accent);margin-right:7px}
.it .nt{font-size:13.5px;color:var(--muted);margin-top:1px}
.it a.pl{font-size:12.5px;color:var(--blue);text-decoration:none}
.tl li.move{padding:0}
.tl li.move .ln{justify-self:center;width:0;border-left:1.5px dashed var(--dash);height:100%;min-height:22px}
.tl li.move span{font-size:12.5px;color:var(--gold);font-weight:600;padding:2px 0}
.alt{margin-top:12px;border-radius:12px;padding:10px 14px;background:color-mix(in srgb,var(--green) 10%,var(--paper));font-size:13.5px;color:var(--green)}
.alt b{font-weight:700}
.stay{margin-top:10px;font-size:13px;color:var(--muted);padding-top:10px;border-top:.5px solid var(--hair)}

/* map */
.mapbox h3 .s{font:500 13px var(--sans);color:var(--muted);letter-spacing:0;margin-left:4px}
.mapbox svg{display:block;width:100%;height:auto;border-radius:14px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:10px 2px 0;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:20px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}

/* transport chain */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px}
.chain .node{font-size:14px;padding:5px 12px;border-radius:9px;background:var(--paper);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.chain .node.end{background:var(--main);color:#fff;box-shadow:none}
.chain .via{font-size:13px;color:var(--gold);font-weight:600}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.lines p{margin:0 0 8px;font-size:14px}
.lines b{color:var(--ink)}
.lines .hot{color:var(--accent);font-weight:600}

/* hikes */
.hike+.hike{margin-top:16px;padding-top:16px;border-top:.5px solid var(--hair)}
.hike h4{margin:0 0 10px;font:700 16px var(--serif);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hike .stats{grid-template-columns:repeat(2,1fr);box-shadow:inset 0 0 0 .5px var(--hair)}

/* lists */
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:.5px solid var(--hair);font-size:14px}
.kv b{white-space:nowrap;font-weight:600}
.kv.total{border:0;color:var(--accent);font:700 17px var(--serif)}
.ck{list-style:none;margin:0;padding:0}
.ck li{display:flex;gap:9px;font-size:14px;padding:4px 0}
.ck li::before{content:"";flex:none;width:6px;height:6px;margin-top:8px;transform:rotate(45deg);background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips span{font-size:12.5px;padding:3px 11px;border-radius:999px;background:var(--sand);color:var(--sand-ink);font-weight:600}
.stayname{font:700 17px var(--serif);margin-bottom:6px}
.box p.tx{margin:0;font-size:14px;color:var(--muted)}
.box a.lk{color:var(--blue);text-decoration:none;font-size:13px;font-weight:600}

/* legacy: flights, bookings, todos */
.flight{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.flight+.flight{margin-top:12px;padding-top:12px;border-top:.5px solid var(--hair)}
.ap b{font-size:22px;font-family:var(--mono);display:block;line-height:1.1}
.ap .t{font-family:var(--mono);font-weight:600}
.ap .n{font-size:12px;color:var(--muted)}
.ap.r{text-align:right}
.mid{text-align:center;font-size:12px;color:var(--muted)}
.fmeta{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.bk{display:flex;gap:10px;font-size:14px}
.bk+.bk{margin-top:10px;padding-top:10px;border-top:.5px solid var(--hair)}
.bk .ic{font-size:20px}
.bk .row{font-size:13px;color:var(--muted)}
.bk .row a{color:var(--blue);text-decoration:none}
.tag{font-size:11px;padding:0 7px;border-radius:999px;margin-left:6px;background:var(--sand);color:var(--sand-ink);font-weight:600;vertical-align:2px}
.tag.no{background:var(--accent);color:#fff}
.tdl{list-style:none;margin:0;padding:0}
.tdl li{display:flex;gap:8px;padding:6px 0;font-size:14px;border-bottom:.5px solid var(--hair)}
.tdl li.done{color:var(--muted);text-decoration:line-through}

.band{position:relative;overflow:hidden;background:var(--main);color:#fff;border-radius:20px;padding:18px 22px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 16px}
.band::after{content:"";position:absolute;inset:6px;border:1px solid rgba(255,255,255,.28);border-radius:15px;pointer-events:none}
.band b{font:700 clamp(18px,2.2cqi,28px)/1.3 var(--serif);letter-spacing:3px}
.band span{font-size:13px;opacity:.9}
.upd{text-align:center;font-size:12px;color:var(--muted);margin-top:16px}

@container (min-width:720px){
  .box{padding:26px 30px}
  .hero{flex-direction:row;justify-content:space-between;align-items:flex-end;padding:40px 40px 34px!important}
  .seal{position:static;order:2;width:56px;height:56px;font-size:19px;flex:none}
  .hero h1{padding-right:0}
  .hero-r{flex-direction:column;align-items:flex-end;flex:none;margin-left:auto}
  .stats,.hike .stats{grid-template-columns:repeat(var(--n,4),1fr)}
  .stat:last-child:nth-child(odd){grid-column:auto}
  .cols.c2{grid-template-columns:1fr 1fr}
  .cols.c3{grid-template-columns:repeat(3,1fr)}
  .cols.c2.mapr{grid-template-columns:1fr 1.25fr}
  .badge{font-size:19px}
  .dayhead h4,.box h3{font-size:23px}
  .dayhead .dt{width:auto}
}
.xp .noexp{display:none!important}

/* export overlay */
.ov{position:fixed;inset:0;z-index:50;background:rgba(15,14,12,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;padding:16px;gap:12px;overflow:auto}
.ov img{max-width:min(100%,720px);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.ov .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;position:sticky;top:0}
.ov .btn{background:#fff;color:#1e1d1a}.ov .btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}
.ov .hint{color:#eee;font-size:13px}
</style>
</head>

<script>
(function(){
const T = JSON.parse(document.getElementById('trip-data').textContent);
const TZ = T.tz || 'Europe/Madrid';
const THEMES = {forest:['#4f7356','#8fb394'], sea:['#2f5670','#86abc4'], terracotta:['#9a4a32','#e08b6e'], plum:['#5f4a6e','#b59cc8'], olive:['#6d6838','#c2bc7c']};
const th = THEMES[T.theme] || (T.theme && T.theme[0]==='#' ? [T.theme,T.theme] : THEMES.forest);
document.documentElement.style.setProperty('--main-l', th[0]);
document.documentElement.style.setProperty('--main-d', th[1]);
const MARK = {gold:'var(--gold)', accent:'var(--accent)', main:'var(--main)', green:'var(--green)', blue:'var(--blue)'};
const WD = ['周日','周一','周二','周三','周四','周五','周六'];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gmap = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const md = s => { const [Y,M,D]=s.split('-').map(Number); return {Y,M,D,wd:WD[new Date(Date.UTC(Y,M-1,D)).getUTCDay()]}; };
const fd = s => { const x=md(s); return `${x.M}/${x.D}（${x.wd}）`; };
const today = (()=>{ const p={}; new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value); return `${p.year}-${p.month}-${p.day}`; })();
const D0 = T.dates && T.dates.start, D1 = T.dates && (T.dates.end || T.dates.start);
const status = !D0 ? 'plan' : (today < D0 ? 'plan' : (today <= D1 ? 'on' : 'gone'));
const days = T.days || [];
const dayColor = (d,i) => MARK[d.color] || d.color || (days.length===1 ? 'var(--main)' : (i%2 ? 'var(--main)' : 'var(--accent)'));
// date of day i: explicit, or derived from trip start
const dayDate = (d,i) => d.date || (D0 ? new Date(Date.UTC(...D0.split('-').map((v,k)=>k===1?v-1:+v)) + i*864e5).toISOString().slice(0,10) : null);

let h = '';
h += `<div class="topbar noexp"><a class="back" href="../">行程</a>
  <span class="st ${status==='on'?'on':status==='gone'?'gone':''}">${status==='on'?'Ongoing':status==='gone'?'Gone':'Plan to go'}</span>
  <button class="btn" id="exp" type="button">⤓ 导出图片</button><nav class="chapters" id="chapters"></nav></div>`;
h += `<div class="poster" id="poster">`;

/* hero */
const dateTxt = D0 ? (D0===D1 ? fd(D0) : `${fd(D0)} – ${fd(D1)}`) : '日期待定';
h += `<header class="box hero"><div class="seal">${esc(sealTxt())}</div><div><h1>${esc(T.title)}</h1>${T.subtitle?`<div class="sub">${esc(T.subtitle)}</div>`:''}
  ${(T.highlights||[]).length?`<div class="hl">${T.highlights.map(esc).join(' · ')}</div>`:''}</div>
  <div class="hero-r">${T.from?`<span class="pill main">出发地 ${esc(T.from)}</span>`:''}<span class="pill">日期 ${esc(dateTxt)}</span>${T.people?`<span class="pill">${esc(T.people)} 人</span>`:''}</div></header>`;

/* now / countdown (web only) */
const EV = T._events || [];
if(status!=='gone' && EV.length){
  const firstTodo = (T.todos||[]).find(t=>!t.done);
  h += `<section class="box now noexp" id="now"><div class="lb"><span class="dot"></span><span id="now-lb">此刻关注 · NOW</span></div>
    <h2 id="now-t"></h2><div class="sb" id="now-s"></div><div class="cdn" id="now-c"></div>
    ${firstTodo?`<div class="peek"><b>当前待办</b><span>${esc(firstTodo.text)}</span><a href="#todos">去清单 ›</a></div>`:''}</section>`;
}

/* stats */
const stats = T.stats || autoStats();
if(stats.length) h += `<div class="stats" id="overview" style="--n:${stats.length}">${stats.map(s=>`<div class="stat"><span>${esc(s.k)}</span><b>${esc(s.v)}</b></div>`).join('')}</div>`;

/* days (+ map beside when one day) */
const hasMap = T.map && T.map.points;
const dayCards = days.map((d,i)=>dayCard(d,i)).join('');
if(days.length===1 && hasMap) h += `<div class="cols c2 mapr">${dayCards}${mapCard()}</div>`;
else {
  if(days.length) h += `<div class="cols ${days.length>1?'c2':''}">${dayCards}</div>`;
  if(hasMap) h += mapCard();
}

/* hikes */
if((T.hikes||[]).length){
  h += `<section class="box" id="hikes"><h3>🥾 徒步路线</h3>${T.hikes.map(k=>{
    const st = [['全程',k.distance],['用时',k.time],['爬升',k.gain],['难度',k.difficulty]].filter(x=>x[1]);
    const url = k.wikiloc || ('https://www.google.com/search?q=' + encodeURIComponent('wikiloc ' + (k.search||k.name)));
    return `<div class="hike"><h4>${esc(k.name)}${k.shape?`<span class="tag">${esc(k.shape)}</span>`:''}</h4>
      <div class="stats" style="--n:${st.length}">${st.map(s=>`<div class="stat"><span>${s[0]}</span><b>${esc(s[1])}</b></div>`).join('')}</div>
      ${k.note?`<div class="note">${esc(k.note)}</div>`:''}
      <div class="noexp" style="margin-top:10px"><a class="btn ghost" href="${esc(url)}" target="_blank" rel="noopener">Wikiloc 轨迹 ↗</a></div></div>`;
  }).join('')}</section>`;
}

/* transport chain (full width) */
const TR = T.transport || {};
if((TR.chain||[]).length){
  h += `<section class="box dashed" id="transport"><h3>${esc(TR.title||'交通路线')}</h3><div class="chain">${TR.chain.map((c,i)=>
    c.via ? `<span class="via">→ ${esc(c.via)} →</span>` : `<span class="node ${i===TR.chain.length-1?'end':''}">${esc(c.at)}</span>`).join('')}</div>
    ${TR.note?`<div class="note">${esc(TR.note)}</div>`:''}</section>`;
}

/* legacy flights + bookings */
if((T.flights||[]).length){
  h += `<section class="box" id="flights"><h3>🚆 长途交通</h3>${T.flights.map(f=>`<div class="flight">
    <div class="ap"><b>${esc(f.from.code)}</b><span class="t">${esc((f.depart||'').slice(11,16))}</span><div class="n">${esc(f.from.name||'')} · ${fd(f.depart.slice(0,10))}</div></div>
    <div class="mid">${esc(f.duration||'')}<br>${({train:'🚄',bus:'🚌',ferry:'⛴'})[f.mode]||'✈'}<br>${esc(f.stops||'')}</div>
    <div class="ap r"><b>${esc(f.to.code)}</b><span class="t">${esc((f.arrive||'').slice(11,16))}</span><div class="n">${esc(f.to.name||'')}</div></div>
    <div class="fmeta">${esc([f.airline,f.number,f.status,f.note].filter(Boolean).join(' · '))}</div></div>`).join('')}</section>`;
}
if((T.bookings||[]).length){
  h += `<section class="box" id="bookings"><h3>🎟️ 预订</h3>${T.bookings.map(b=>`<div class="bk"><div class="ic">${esc(b.icon||'📌')}</div><div>
    <b>${esc(b.title)}</b>${b.status?`<span class="tag ${/待|未/.test(b.status)?'no':''}">${esc(b.status)}</span>`:''}
    ${b.time?`<div class="row">🕒 ${esc(b.time)}</div>`:''}
    ${b.address?`<div class="row">📍 <a href="${gmap(b.q||b.address)}" target="_blank" rel="noopener">${esc(b.address)}</a></div>`:''}
    ${b.note?`<div class="row">${esc(b.note)}</div>`:''}</div></div>`).join('')}</section>`;
}

/* bottom trio: stay / transport text / budget / tips */
const trio = [];
if(T.stay) trio.push(`<section class="box"><h3>住宿</h3><div class="stayname">${esc(T.stay.name)}</div><p class="tx">${esc(T.stay.text||'')}</p>
  ${T.stay.q?`<div class="noexp" style="margin-top:8px"><a class="lk" href="${gmap(T.stay.q)}" target="_blank" rel="noopener">📍 在地图中打开</a></div>`:''}</section>`);
if((TR.lines||[]).length) trio.push(`<section class="box"><h3>${esc(TR.title||'交通')}</h3><div class="lines">${TR.lines.map(l=>`<p class="${l.hot?'hot':''}">${l.label?`<b>${esc(l.label)}：</b>`:''}${esc(l.text)}</p>`).join('')}</div>
  ${(T.packing||[]).length?`<div class="chips">${T.packing.map(p=>`<span>${esc(p)}</span>`).join('')}</div>`:''}</section>`);
if(T.budget) trio.push(`<section class="box"><h3>${esc(T.budget.title||'预算参考（一人）')}</h3>${(T.budget.rows||[]).map(r=>`<div class="kv"><span>${esc(r.label)}</span><b>${esc(r.actual||r.est)}</b></div>`).join('')}
  ${T.budget.total?`<div class="kv total"><span>合计约</span><span>${esc(T.budget.total)}</span></div>`:''}${T.budget.note?`<div class="note">${esc(T.budget.note)}</div>`:''}</section>`);
const tipList = T.checklist || [];
if(tipList.length || (!(TR.lines||[]).length && (T.packing||[]).length)) trio.push(`<section class="box"><h3>${esc(T.checklistTitle||'行前小贴士')}</h3><ul class="ck">${tipList.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
  ${!(TR.lines||[]).length && (T.packing||[]).length?`<div class="chips">${T.packing.map(p=>`<span>${esc(p)}</span>`).join('')}</div>`:''}</section>`);
if(trio.length) h += `<div id="info" class="cols ${trio.length>=3?'c3':trio.length===2?'c2':''}">${trio.join('')}</div>`;

/* legacy todos + tips */
if((T.todos||[]).length){
  h += `<section class="box" id="todos"><h3>✅ 待办</h3><ul class="tdl">${T.todos.map(t=>`<li class="${t.done?'done':''}">${t.done?'✅':(t.urgent?'🔴':'⬜')} ${esc(t.text)}${t.due&&!t.done?`<span class="tag">${esc(t.due)}</span>`:''}</li>`).join('')}</ul></section>`;
}
if((T.tips||[]).length){
  h += `<section class="box" id="tips"><h3>💡 贴士</h3><ul class="ck">${T.tips.map(t=>`<li><span><b>${esc(t.title)}</b> ${esc(t.text)}</span></li>`).join('')}</ul></section>`;
}

if(T.band) h += `<div class="band"><b>${esc(T.band.text||'')}</b>${T.band.note?`<span>${esc(T.band.note)}</span>`:''}</div>`;
h += `</div>`; // poster
if(T.updated) h += `<div class="upd">最后更新 ${esc(T.updated)} · <a href="../">Travel Plan</a></div>`;
document.getElementById('app').innerHTML = h;

/* chapter nav: only sections that exist */
const CH = [['now','此刻'],['overview','概览'],['day1','行程'],['map','地图'],['hikes','徒步'],['transport','交通'],['flights','长途交通'],['bookings','预订'],['info', T.budget?'住宿·预算':'实用信息'],['todos','待办'],['tips','贴士']]
  .filter(([id])=>document.getElementById(id));
const $ch = document.getElementById('chapters');
$ch.innerHTML = CH.map(([id,l])=>`<a href="#${id}" data-ch="${id}">${l}</a>`).join('');
if('IntersectionObserver' in window){
  const seen = new Map();
  const io = new IntersectionObserver(es=>{ es.forEach(e=>seen.set(e.target.id, e.isIntersecting)); const cur = CH.find(([id])=>seen.get(id));
    $ch.querySelectorAll('a').forEach(a=>a.classList.toggle('on', !!cur && a.dataset.ch===cur[0]));
    const on=$ch.querySelector('a.on'); if(on) $ch.scrollTo({left:on.offsetLeft-60, behavior:'smooth'}); }, {rootMargin:'-112px 0px -55% 0px'});
  CH.forEach(([id])=>io.observe(document.getElementById(id)));
}

/* countdown tick */
if(document.getElementById('now')){
  const $t=document.getElementById('now-t'), $s=document.getElementById('now-s'), $c=document.getElementById('now-c'), $l=document.getElementById('now-lb');
  const fmtT = ms => new Intl.DateTimeFormat('zh-CN',{timeZone:TZ,month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(ms));
  const tick = ()=>{
    const now = Date.now(), e = EV.find(e=>e[0]>now), p2 = n=>String(n).padStart(2,'0');
    if(!e){ $l.textContent='行程安排已全部结束'; $t.textContent='一路平安，旅途愉快'; $s.textContent=''; $c.textContent=''; return; }
    let x = Math.floor((e[0]-now)/1000); const D = Math.floor(x/86400); x %= 86400;
    $t.textContent = e[1]; $s.textContent = e[2] || '';
    $c.innerHTML = `${D?D+'天 ':''}${p2(Math.floor(x/3600))}:${p2(Math.floor(x%3600/60))}:${p2(x%60)}<small>后 · ${esc(fmtT(e[0]))}（当地时间）</small>`;
  };
  tick(); setInterval(tick, 1000);
}

/* ---------- pieces ---------- */
function sealTxt(){ if(T.seal) return T.seal; const n = D0 ? Math.round((Date.parse(D1)-Date.parse(D0))/864e5)+1 : (T.length||days.length||1); return n===1?'一日':(['','一','二','三','四','五','六','七','八','九','十'][n]||n)+'日'; }
function autoStats(){
  const n = D0 ? Math.round((Date.parse(D1)-Date.parse(D0))/864e5)+1 : (T.length || days.length);
  const s = [];
  if(n) s.push({k:'天数', v: n===1?'一日':`${n} 天 ${n-1} 晚`});
  if(T.dest) s.push({k:'目的地', v:T.dest});
  if(T.mode) s.push({k:'主要交通', v:T.mode});
  if(T.budget && T.budget.total) s.push({k:'预算（一人）', v:T.budget.total});
  return s;
}
function dayCard(d,i){
  const c = dayColor(d,i), dt = dayDate(d,i);
  let n = 0;
  let s = `<section class="box" id="day${i+1}"><div class="dayhead"><span class="badge" style="background:${c}">${esc(d.badge || (days.length===1?'一日行程':'Day '+(i+1)))}</span><h4>${esc(d.title||'')}</h4>
    ${dt?`<span class="dt">${fd(dt)}${dt===today?' <span class="today noexp">今天</span>':''}</span>`:''}</div><ul class="tl">`;
  (d.items||[]).forEach(it=>{
    if(it.move){ s += `<li class="move"><span class="ln"></span><span>↓ ${esc(it.move)}</span></li>`; return; }
    n++; it._n = n;
    s += `<li><span class="num" style="background:${MARK[it.mark]||c}">${n}</span><div class="it">
      <div class="t1">${it.time?`<i>${esc(it.time)}</i>`:''}${esc(it.title)}</div>
      ${it.note?`<div class="nt">${esc(it.note)}</div>`:''}
      ${it.place?`<a class="pl noexp" href="${gmap(it.place)}" target="_blank" rel="noopener">📍 ${esc(it.placeLabel||it.place)}</a>`:''}</div></li>`;
  });
  s += `</ul>`;
  if(d.stay) s += `<div class="stay">🛏️ 今晚住 ${esc(d.stay)}</div>`;
  if(d.alt) s += `<div class="alt"><b>${esc(d.alt.title||'替代方案')}：</b>${esc(d.alt.text)}</div>`;
  return s + `</section>`;
}
function mapCard(){
  const all = routeUrl(allRoutePts(), T.travelmode || inferMode());
  const per = days.length>1 ? days.map((d,i)=>[d, i, routeUrl(dayPts(d), dayMode(d))]).filter(x=>x[2]) : [];
  return `<section class="box mapbox" id="map"><h3>路线地图${T.map.subtitle?`<span class="s">${esc(T.map.subtitle)}</span>`:''}</h3>${renderMap(all)}
    ${all?`<div class="maplinks noexp"><a class="main" href="${esc(all)}" target="_blank" rel="noopener">🧭 Google 地图打开${days.length>1?'全程':''}路线 ↗</a>${per.map(([d,i,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(d.mapLabel||('Day '+(i+1)))} ↗</a>`).join('')}</div>
    <div class="note noexp">点地图打开整条路线；点图钉或地点打开该位置。</div>`:''}</section>`;
}
function ploc(p){ return p.q || `${p.lat},${p.lon}`; }
function inferMode(){ const m = (T.mode||'') + ' ' + ((T.hikes||[]).length?'徒步':''); return /自驾|开车|租车|drive/i.test(m) ? 'driving' : (/徒步|步行|hike|walk/i.test(m) && !/TRAM|大巴|火车|高铁|地铁|飞/i.test(T.mode||'') ? 'walking' : (/TRAM|大巴|火车|高铁|地铁|公交|bus|train/i.test(m) ? 'transit' : 'walking')); }
function dayMode(d){ return d.travelmode || T.travelmode || inferMode(); }
function dayPts(d){ const P=T.map.points; const r=(d.route||[]).map(id=>P[id]).filter(p=>p&&!p.offmap); return r.filter((p,i)=>i===0||p!==r[i-1]); }
function allRoutePts(){ const seen=new Set(), out=[]; days.forEach(d=>dayPts(d).forEach(p=>{ if(!seen.has(p)){ seen.add(p); out.push(p); } })); if(!out.length) Object.values(T.map.points).filter(p=>!p.offmap).forEach(p=>out.push(p)); return out; }
function routeUrl(pts, mode){
  if(pts.length<2) return pts.length ? gmap(ploc(pts[0])) : '';
  const o=pts[0], de=pts[pts.length-1], w=pts.slice(1,-1).slice(0,9);
  let u = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(ploc(o))}&destination=${encodeURIComponent(ploc(de))}`;
  if(w.length) u += `&waypoints=${w.map(p=>encodeURIComponent(ploc(p))).join('%7C')}`;
  if(!(mode==='transit' && w.length)) u += `&travelmode=${mode}`;   // Google ignores waypoints in transit mode, so let it choose
  return u;
}
function renderMap(routeLink){
  const M = T.map, P = M.points, ids = Object.keys(P);
  let la0=Infinity,la1=-Infinity,lo0=Infinity,lo1=-Infinity;
  ids.filter(k=>!P[k].offmap).forEach(k=>{const p=P[k];la0=Math.min(la0,p.lat);la1=Math.max(la1,p.lat);lo0=Math.min(lo0,p.lon);lo1=Math.max(lo1,p.lon);});
  if(M.bounds) [la0,lo0,la1,lo1] = M.bounds;
  const k = Math.cos((la0+la1)/2*Math.PI/180), w=(lo1-lo0)*k, hg=la1-la0;
  const W=640, pad=46, sc=Math.min((W-2*pad)/(w||1e-3), (M.maxH||560)/(hg||1e-3));
  const H=Math.max(300, Math.round(hg*sc+2*pad)), ox=(W-w*sc)/2, oy=(H-hg*sc)/2;
  const X=lon=>ox+(lon-lo0)*k*sc, Y=lat=>oy+(la1-lat)*sc;
  const path = (pts,close) => pts.map((p,i)=>(i?'L':'M')+X(p[1]).toFixed(1)+' '+Y(p[0]).toFixed(1)).join('') + (close?'Z':'');
  const uid = 'm'+Math.random().toString(36).slice(2,7);
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="路线地图">
  <defs><filter id="${uid}r"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
  <pattern id="${uid}w" width="34" height="18" patternUnits="userSpaceOnUse"><path d="M2 10q6-6 12 0t12 0" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.2"/></pattern>
  <pattern id="${uid}d" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="var(--map-ink)" opacity=".25"/></pattern></defs>
  <rect width="${W}" height="${H}" fill="${M.land?'var(--map-water)':'var(--map-land)'}"/>`;
  if(M.land) s += `<rect width="${W}" height="${H}" fill="url(#${uid}w)"/>`;
  (M.land||[]).forEach(p=>{ s += `<path d="${path(p,1)}" fill="var(--map-land)" stroke="var(--map-ink)" stroke-width="1.2" filter="url(#${uid}r)"/>`; });
  s += `<rect width="${W}" height="${H}" fill="url(#${uid}d)"/>`;
  (M.areas||[]).forEach(a=>{
    s += `<path d="${path(a.poly,1)}" fill="var(--map-park)" stroke="var(--green)" stroke-width="1.3" stroke-dasharray="5 4" opacity=".95" filter="url(#${uid}r)"/>`;
    if(a.name){ const c=a.labelAt||a.poly.reduce((m,p)=>[m[0]+p[0]/a.poly.length,m[1]+p[1]/a.poly.length],[0,0]);
      s += `<text x="${X(c[1])}" y="${Y(c[0])}" fill="var(--green)" font-size="15" font-weight="700" text-anchor="middle" transform="rotate(${a.rotate||0} ${X(c[1])} ${Y(c[0])})" opacity=".85">${esc(a.name)}</text>`; }
  });
  (M.labels||[]).forEach(l=>{ s += `<text x="${X(l.lon)}" y="${Y(l.lat)}" fill="${l.sea?'var(--blue)':'var(--map-ink)'}" font-size="${l.size||14}" font-weight="700" text-anchor="middle" opacity=".85">${esc(l.text)}</text>`; });
  const legend = [];
  (M.lines||[]).forEach(L=>{
    s += `<path d="${path(L.pts)}" fill="none" stroke="${MARK[L.color]||L.color||'var(--map-ink)'}" stroke-width="${L.width||3}" stroke-linecap="round" ${L.dash?`stroke-dasharray="${L.dash}"`:''} opacity=".85"/>`;
    if(L.name) legend.push([MARK[L.color]||L.color||'var(--map-ink)', L.name, L.dash]);
  });
  // day routes
  days.forEach((d,i)=>{
    const c = dayColor(d,i);
    const r = (d.route||[]).map(id=>P[id]&&Object.assign({id},P[id])).filter(Boolean);
    if(r.length<2) return;
    if(!d.noLegend) legend.push([c, d.mapLabel || (days.length>1?`Day ${i+1}`:'步行路线'), '7 6']);
    for(let j=0;j<r.length-1;j++){
      let a=r[j], b=r[j+1], ax=X(a.lon), ay=Y(a.lat), bx=X(b.lon), by=Y(b.lat);
      if(a.offmap||b.offmap){
        const inn=a.offmap?[bx,by]:[ax,ay], out=a.offmap?[ax,ay]:[bx,by];
        const dx=out[0]-inn[0], dy=out[1]-inn[1], L=Math.hypot(dx,dy)||1, len=Math.min(90,L);
        const ex=inn[0]+dx/L*len, ey=inn[1]+dy/L*len;
        if(a.offmap){ax=ex;ay=ey}else{bx=ex;by=ey}
        s += `<text x="${ex}" y="${ey+(dy>0?16:-8)}" font-size="12.5" fill="var(--map-ink)" text-anchor="middle" paint-order="stroke" stroke="var(--paper)" stroke-width="3">${esc(a.offmap?a.name:b.name)} 方向</text>`;
      }
      const mx=(ax+bx)/2+(by-ay)*.1, my=(ay+by)/2-(bx-ax)*.1;
      s += `<path d="M${ax} ${ay}Q${mx} ${my} ${bx} ${by}" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="${(d.dashed||[]).includes(j)?'2 7':'7 6'}"/>`;
    }
  });
  if(routeLink) s += `<a href="${esc(routeLink)}" target="_blank" rel="noopener" aria-label="在 Google 地图打开路线"><rect width="${W}" height="${H}" fill="#000" fill-opacity="0"/></a>`;
  // plain points
  const pinned = {};
  days.forEach((d,i)=>(d.items||[]).forEach(it=>{ if(it.pt && P[it.pt] && !P[it.pt].offmap){ (pinned[it.pt]=pinned[it.pt]||[]).push({n:it._n, c:MARK[it.mark]||dayColor(d,i), time:it.time}); } }));
  ids.forEach(id=>{
    const p=P[id]; if(p.offmap) return; const x=X(p.lon), y=Y(p.lat), pins=pinned[id];
    if(pins){
      const f = pins[0];
      s += `<a class="pinlk" href="${esc(gmap(ploc(p)))}" target="_blank" rel="noopener"><g transform="translate(${x},${y})"><path d="M0 0C-4-8-13-12-13-22a13 13 0 0 1 26 0C13-12 4-8 0 0Z" fill="${f.c}" stroke="#fff" stroke-width="1.6"/><text y="-17" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">${pins.map(q=>q.n).join('·')}</text></g></a>`;
    } else {
      s += `<a class="pinlk" href="${esc(gmap(ploc(p)))}" target="_blank" rel="noopener"><circle cx="${x}" cy="${y}" r="11" fill="#000" fill-opacity="0"/><circle cx="${x}" cy="${y}" r="${p.kind==='minor'?3:4.5}" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/></a>`;
    }
    if(p.label!==false){
      const anc = p.anchor || (x > W*0.62 ? 'end' : 'start'), dx = anc==='end'?-16:(anc==='middle'?0:16);
      const ty = y + (p.dy!=null ? p.dy : (pins?-14:4));
      const t = (pins && p.time!==false && pins[0].time) ? `<tspan font-size="11.5" fill="var(--accent)" font-weight="700">${esc(pins[0].time)} </tspan>` : '';
      s += `<text x="${x+dx}" y="${ty}" font-size="${p.big?15:13}" font-weight="${p.big?800:600}" fill="${p.big?'var(--accent)':'var(--ink)'}" text-anchor="${anc}" paint-order="stroke" stroke="var(--paper)" stroke-width="3.5" stroke-linejoin="round">${t}${esc(p.name)}</text>`;
    }
  });
  // compass + scale
  s += `<g transform="translate(${W-36},40)"><circle r="20" fill="var(--paper)" stroke="var(--map-ink)" stroke-width="1.2"/><path d="M0-14L5 2L0-2L-5 2Z" fill="var(--accent)"/><text y="14" font-size="10" text-anchor="middle" fill="var(--map-ink)">N</text></g>`;
  const kmpx = 111.32/sc, nice=[.5,1,2,5,10,20,50,100], km = nice.find(n=>n/kmpx>55)||100, px=km/kmpx;
  s += `<g transform="translate(18,${H-18})" stroke="var(--map-ink)" fill="var(--map-ink)"><path d="M0 -4V0H${px}V-4" fill="none" stroke-width="1.4"/><text x="${px/2}" y="-8" font-size="11" text-anchor="middle" stroke="none">${km} km</text></g>`;
  s += `<text x="${W-14}" y="${H-12}" font-size="10.5" fill="var(--map-ink)" text-anchor="end">示意图，非实际比例</text></svg>`;
  return s + (legend.length?`<div class="legend">${legend.map(([c,t,dash])=>`<span><i style="border-color:${c};${dash?'border-top-style:dashed':''}"></i>${esc(t)}</span>`).join('')}</div>`:'');
}

/* ---------- export to image ---------- */
const $exp = document.getElementById('exp');
$exp.addEventListener('click', async ()=>{
  if(!window.htmlToImage){ alert('导出组件没有加载成功，请刷新后再试。'); return; }
  const old = $exp.textContent; $exp.textContent = '生成中…'; $exp.disabled = true;
  const box = document.createElement('div');
  box.className = 'xp';
  box.style.cssText = 'position:absolute;left:-20000px;top:0;width:1240px;background:#f3f0e8';
  box.appendChild(document.getElementById('poster').cloneNode(true));
  document.body.appendChild(box);
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const node = box.firstChild, H = node.scrollHeight;
    const pr = Math.max(1, Math.min(2, Math.sqrt(16e6/(1240*H))));
    const opt = {pixelRatio:pr, backgroundColor:'#f3f0e8', cacheBust:true};
    await htmlToImage.toBlob(node, opt); // Safari needs a warm-up pass before it paints SVG/foreignObject reliably
    const blob = await htmlToImage.toBlob(node, opt);
    showResult(blob);
  }catch(e){ alert('导出失败：' + (e && e.message || e)); }
  finally{ box.remove(); $exp.textContent = old; $exp.disabled = false; }
});
function showResult(blob){
  const name = (T._slug || 'trip') + '.png', url = URL.createObjectURL(blob);
  const file = new File([blob], name, {type:'image/png'});
  const canShare = navigator.canShare && navigator.canShare({files:[file]});
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="bar">${canShare?'<button class="btn" data-a="share" type="button">分享 / 存到相册</button>':''}
    <a class="btn ${canShare?'ghost':''}" href="${url}" download="${name}">下载 PNG</a><button class="btn ghost" data-a="close" type="button">关闭</button></div>
    <div class="hint">手机上也可以长按图片保存</div><img alt="${esc(T.title)}" src="${url}">`;
  ov.addEventListener('click', async e=>{
    const a = e.target.closest('[data-a]'); if(!a) return;
    if(a.dataset.a==='close'){ ov.remove(); URL.revokeObjectURL(url); }
    if(a.dataset.a==='share'){ try{ await navigator.share({files:[file], title:T.title}); }catch(err){} }
  });
  document.body.appendChild(ov);
}
})();
</script>
